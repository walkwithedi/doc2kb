name: Bug report
description: A document converted wrongly, or a script did something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never attach real documents, personal data or private paths; describe them, or attach a small fictional document that shows the problem.
        Security problems go through the Security tab ("Report a vulnerability"), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you use, or the VERSION file
      placeholder: "1.0.0"
  - type: input
    id: command
    attributes:
      label: Command or dialog choices
      placeholder: "python3 doc2kb_core.py --batch SOURCE -o OUTPUT --merge"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: "Python 3.10, Linux"
