<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doc2kb</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --focus:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --focus:#4493f8; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 "Noto Sans CJK SC","WenQuanYi Micro Hei","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:17px; margin:0 0 10px; }
  h3 { font-size:15px; margin:14px 0 6px; }
  .sub, .hint { color:var(--muted); }
  .sub { margin:4px 0 12px; }
  .hint { font-size:13px; margin:6px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:12px 0; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .row > input[type=text] { flex:1 1 220px; min-width:0; }
  label.field { display:block; color:var(--muted); margin:8px 0 4px; }
  input[type=text], input[type=date], input[type=number], select, textarea { padding:7px 10px; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); max-width:100%; }
  input[type=number] { width:6em; }
  textarea { width:100%; min-height:4em; font-family:"Noto Sans Mono CJK SC","DejaVu Sans Mono",monospace; font-size:13px; }
  .check { display:flex; gap:8px; align-items:flex-start; margin:6px 0; }
  .check input { margin-top:5px; flex:none; }
  .check span small { display:block; color:var(--muted); font-size:13px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  button { padding:7px 14px; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.small { padding:2px 8px; font-size:13px; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  [role=tablist] { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--line); margin:8px 0 0; }
  [role=tab] { border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; background:none; color:var(--muted); margin-bottom:-1px; }
  [role=tab][aria-selected=true] { background:var(--card); border-color:var(--line); color:var(--text); font-weight:bold; }
  .status { margin:8px 0 0; min-height:1.6em; white-space:pre-wrap; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .info { color:var(--accent); }
  pre, .mono { font:13px/1.5 "Noto Sans Mono CJK SC","DejaVu Sans Mono",monospace; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:8px 0 0; max-height:360px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .scroll { overflow-x:auto; max-height:420px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:normal; position:sticky; top:0; background:var(--card); }
  td.rel { word-break:break-all; min-width:12em; }
  td.wrap, .wrap { word-break:break-all; }
  td.name { min-width:6em; overflow-wrap:anywhere; }
  td.num { text-align:right; white-space:nowrap; }
  td.act { white-space:nowrap; }
  .browser { border:1px solid var(--line); border-radius:6px; padding:8px; margin-top:8px; background:var(--bg); }
  .browser ul { list-style:none; margin:6px 0; padding:0; max-height:260px; overflow:auto; }
  .browser li > button { width:100%; text-align:left; border:none; background:none; padding:4px 6px; word-break:break-all; }
  .browser li > button:hover { background:var(--card); }
  .browser li label { display:flex; gap:6px; align-items:flex-start; padding:2px 6px; word-break:break-all; }
  .browser li label input { margin-top:5px; flex:none; }
  progress { width:100%; height:14px; margin-top:8px; }
  details summary { cursor:pointer; margin-top:8px; }
  footer { color:var(--muted); font-size:13px; margin-top:24px; border-top:1px solid var(--line); padding-top:10px; }
  #closed { background:var(--card); border:1px solid var(--bad); color:var(--bad); border-radius:8px; padding:12px; margin-top:12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title"></h1>
    <button id="quit" type="button" data-t="quit"></button>
  </header>
  <p class="sub" data-t="sub"></p>
  <div id="closed" hidden></div>
  <p id="error" class="status bad" aria-live="polite"></p>

  <div role="tablist" id="tabs" data-t-label="tabs">
    <button role="tab" id="tab-batch" aria-controls="panel-batch" aria-selected="true" data-t="tab_batch"></button>
    <button role="tab" id="tab-files" aria-controls="panel-files" aria-selected="false" data-t="tab_files"></button>
    <button role="tab" id="tab-tasks" aria-controls="panel-tasks" aria-selected="false" data-t="tab_tasks"></button>
    <button role="tab" id="tab-dedup" aria-controls="panel-dedup" aria-selected="false" data-t="tab_dedup"></button>
  </div>

  <!-- ===================== folder batch ===================== -->
  <section role="tabpanel" id="panel-batch" aria-labelledby="tab-batch" tabindex="0">
    <div class="card">
      <h2 data-t="h_source"></h2>
      <label class="field" for="src" data-t="src_label"></label>
      <div class="row">
        <input id="src" type="text" autocomplete="off" spellcheck="false">
        <button id="srcBrowse" type="button" aria-expanded="false" data-t="browse"></button>
      </div>
      <div id="browserHomeSrc"></div>
      <div class="check">
        <input id="useSince" type="checkbox">
        <label for="useSince"><span data-t="since_label"></span></label>
      </div>
      <div class="row" id="sinceRow" hidden>
        <input id="since" type="date" data-t-label="since_label">
        <span class="hint" data-t="since_hint"></span>
      </div>
      <div class="actions">
        <button id="scan" class="primary" type="button" data-t="scan"></button>
        <button id="scanCancel" class="cancel" type="button" data-t="cancel" hidden></button>
      </div>
      <progress id="scanProg" hidden></progress>
      <p id="scanStatus" class="status" aria-live="polite"></p>
    </div>

    <div class="card" id="listCard" hidden>
      <h2 data-t="h_files"></h2>
      <p id="listSummary"></p>
      <div class="actions">
        <button id="all" type="button" data-t="tick_all"></button>
        <button id="none" type="button" data-t="tick_none"></button>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th scope="col"><span data-t="col_take"></span></th><th scope="col" data-t="col_rel"></th><th scope="col" class="num" data-t="col_size"></th></tr></thead>
          <tbody id="fileRows"></tbody>
        </table>
      </div>
      <p id="listNote" class="status" aria-live="polite"></p>
      <details id="legacyBox" hidden>
        <summary id="legacySummary"></summary>
        <pre id="legacyList"></pre>
      </details>
    </div>

    <div class="card" id="runCard" hidden>
      <h2 data-t="h_output"></h2>
      <label class="field" for="out" data-t="out_label"></label>
      <div class="row">
        <input id="out" type="text" autocomplete="off" spellcheck="false">
        <button id="outBrowse" type="button" aria-expanded="false" data-t="browse"></button>
      </div>
      <div id="browserHomeOut"></div>
      <div class="opts" data-prefix="b"></div>
      <label class="field" for="batchSize" data-t="batch_size_label"></label>
      <input id="batchSize" type="number" min="0" max="1000000" step="1" value="1000" inputmode="numeric">
      <p class="hint" id="batchHint"></p>
      <fieldset id="existingBox" style="border:1px solid var(--line); border-radius:6px; margin:8px 0 0">
        <legend id="existingLegend"></legend>
        <div class="check"><input id="exSkip" name="existing" type="radio" checked><label for="exSkip" id="exSkipLabel"></label></div>
        <div class="check"><input id="exRedo" name="existing" type="radio"><label for="exRedo" id="exRedoLabel"></label></div>
      </fieldset>
      <div class="actions">
        <button id="run" class="primary" type="button" data-t="run"></button>
        <button id="runCancel" class="cancel" type="button" data-t="cancel" hidden></button>
      </div>
      <progress id="runProg" max="100" value="0" hidden></progress>
      <p id="runStatus" class="status" aria-live="polite"></p>
    </div>

    <div class="card result" id="batchResult" hidden></div>
  </section>

  <!-- ===================== chosen files ===================== -->
  <section role="tabpanel" id="panel-files" aria-labelledby="tab-files" tabindex="0" hidden>
    <div class="card">
      <h2 data-t="h_chosen"></h2>
      <p class="hint" data-t="chosen_hint"></p>
      <div class="actions">
        <button id="filesAdd" type="button" aria-expanded="false" data-t="files_add"></button>
        <button id="filesClear" type="button" data-t="files_clear"></button>
      </div>
      <div id="browserHomeFiles"></div>
      <div class="scroll" id="filesTable" hidden>
        <table>
          <thead><tr><th scope="col" data-t="col_path"></th><th scope="col"><span data-t="col_remove"></span></th></tr></thead>
          <tbody id="filesRows"></tbody>
        </table>
      </div>
      <p id="filesNote" class="status" aria-live="polite"></p>
    </div>
    <div class="card">
      <h2 data-t="h_output"></h2>
      <label class="field" for="filesOut" data-t="out_label"></label>
      <div class="row">
        <input id="filesOut" type="text" autocomplete="off" spellcheck="false">
        <button id="filesOutBrowse" type="button" aria-expanded="false" data-t="browse"></button>
      </div>
      <div id="browserHomeFilesOut"></div>
      <p class="hint" data-t="files_out_hint"></p>
      <div class="opts" data-prefix="f"></div>
      <div class="actions">
        <button id="filesRun" class="primary" type="button" data-t="run"></button>
        <button id="filesCancel" class="cancel" type="button" data-t="cancel" hidden></button>
      </div>
      <progress id="filesProg" max="100" value="0" hidden></progress>
      <p id="filesStatus" class="status" aria-live="polite"></p>
    </div>
    <div class="card result" id="filesResult" hidden></div>
  </section>

  <!-- ===================== incremental tasks ===================== -->
  <section role="tabpanel" id="panel-tasks" aria-labelledby="tab-tasks" tabindex="0" hidden>
    <div class="card">
      <h2 data-t="h_tasks"></h2>
      <p class="hint" data-t="tasks_hint"></p>
      <div class="scroll">
        <table>
          <thead><tr><th scope="col"><span data-t="col_take"></span></th><th scope="col" data-t="col_task"></th><th scope="col" data-t="col_last"></th></tr></thead>
          <tbody id="taskRows"></tbody>
        </table>
      </div>
      <p id="tasksNote" class="status" aria-live="polite"></p>
      <div class="row" style="margin-top:8px">
        <label for="taskDays" data-t="days_label"></label>
        <input id="taskDays" type="number" min="1" max="36500" value="30">
      </div>
      <div class="actions">
        <button id="taskNew" type="button" data-t="task_new"></button>
        <button id="taskPreview" type="button" data-t="task_preview"></button>
        <button id="taskRun" class="primary" type="button" data-t="task_run"></button>
        <button id="taskRunAll" type="button" data-t="task_run_all"></button>
        <button id="tasksCancel" class="cancel" type="button" data-t="cancel" hidden></button>
      </div>
      <progress id="tasksProg" max="100" value="0" hidden></progress>
      <p id="tasksStatus" class="status" aria-live="polite"></p>
    </div>

    <div class="card" id="taskForm" hidden>
      <h2 id="taskFormHead"></h2>
      <label class="field" for="taskName" data-t="task_name"></label>
      <input id="taskName" type="text" autocomplete="off" style="width:100%">
      <label class="field" for="taskSrc" data-t="task_src"></label>
      <div class="row">
        <input id="taskSrc" type="text" autocomplete="off" spellcheck="false">
        <button id="taskSrcBrowse" type="button" aria-expanded="false" data-t="browse"></button>
      </div>
      <div id="browserHomeTaskSrc"></div>
      <label class="field" for="taskOut" data-t="task_out"></label>
      <div class="row">
        <input id="taskOut" type="text" autocomplete="off" spellcheck="false">
        <button id="taskOutBrowse" type="button" aria-expanded="false" data-t="browse"></button>
      </div>
      <div id="browserHomeTaskOut"></div>
      <p class="hint" data-t="task_out_hint"></p>
      <div class="actions">
        <button id="taskSave" class="primary" type="button" data-t="save"></button>
        <button id="taskBack" type="button" data-t="back"></button>
      </div>
      <p id="taskFormStatus" class="status" aria-live="polite"></p>
    </div>

    <div class="card" id="tasksResult" hidden>
      <h2 data-t="h_result"></h2>
      <p id="tasksResultStatus" class="status" aria-live="polite"></p>
      <div class="scroll">
        <table>
          <thead><tr><th scope="col" data-t="col_task"></th><th scope="col" data-t="col_outcome"></th></tr></thead>
          <tbody id="tasksResultRows"></tbody>
        </table>
      </div>
      <div id="tasksOutputs"></div>
    </div>
  </section>

  <!-- ===================== duplicate clean-up ===================== -->
  <section role="tabpanel" id="panel-dedup" aria-labelledby="tab-dedup" tabindex="0" hidden>
    <div class="card">
      <h2 data-t="h_dedup"></h2>
      <p class="hint" data-t="dedup_hint"></p>
      <label class="field" for="dedupTarget" data-t="dedup_target"></label>
      <div class="row">
        <input id="dedupTarget" type="text" autocomplete="off" spellcheck="false">
        <button id="dedupBrowse" type="button" aria-expanded="false" data-t="browse"></button>
      </div>
      <div id="browserHomeDedup"></div>
      <label class="field" for="dedupBase" data-t="dedup_base"></label>
      <textarea id="dedupBase" spellcheck="false"></textarea>
      <div class="check"><input id="dedupNoDb" type="checkbox"><label for="dedupNoDb"><span><span data-t="dedup_nodb"></span><small data-t="dedup_nodb_d"></small></span></label></div>
      <div class="actions">
        <button id="dedupDry" class="primary" type="button" data-t="dedup_dry"></button>
        <button id="dedupClean" type="button" data-t="dedup_clean" disabled></button>
        <button id="dedupCancel" class="cancel" type="button" data-t="cancel" hidden></button>
      </div>
      <progress id="dedupProg" hidden></progress>
      <p id="dedupStatus" class="status" aria-live="polite"></p>
    </div>
    <div class="card" id="dedupResult" hidden>
      <h2 data-t="h_result"></h2>
      <p id="dedupResultStatus" class="status" aria-live="polite"></p>
      <h3 id="dedupReportHead" data-t="h_dedup_report" hidden></h3>
      <pre id="dedupReport" hidden></pre>
      <details id="dedupOutputBox" hidden>
        <summary data-t="h_output_tail"></summary>
        <pre id="dedupOutput"></pre>
      </details>
    </div>
  </section>

  <footer><span data-t="foot_rule"></span> <span id="version"></span></footer>
</main>

<template id="browserTpl">
  <div class="browser">
    <div class="row">
      <select class="b-roots"></select>
      <button type="button" class="b-up"></button>
    </div>
    <div class="row" style="margin-top:6px">
      <input type="text" class="b-path mono" autocomplete="off" spellcheck="false">
      <button type="button" class="b-go"></button>
    </div>
    <p class="hint b-count"></p>
    <ul class="b-dirs"></ul>
    <ul class="b-files"></ul>
    <p class="status b-status" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="primary b-pick"></button>
      <button type="button" class="primary b-add"></button>
      <button type="button" class="b-close"></button>
    </div>
  </div>
</template>

<template id="optsTpl">
  <h3 data-t="h_options"></h3>
  <div class="check"><input class="o-merge" type="checkbox" checked><label><span><span data-t="opt_merge"></span><small data-t="opt_merge_d"></small></span></label></div>
  <div class="check"><input class="o-inline" type="checkbox" checked><label><span><span data-t="opt_inline"></span><small data-t="opt_inline_d"></small></span></label></div>
  <div class="check"><input class="o-images" type="checkbox"><label><span><span data-t="opt_images"></span><small data-t="opt_images_d"></small></span></label></div>
  <div class="check"><input class="o-sheets" type="checkbox" disabled><label><span><span data-t="opt_sheets"></span><small class="o-sheets-hint"></small></span></label></div>
  <div class="check"><input class="o-dups" type="checkbox"><label><span><span data-t="opt_dups"></span><small data-t="opt_dups_d"></small></span></label></div>
</template>

<template id="resultTpl">
  <h2 data-t="h_result"></h2>
  <p class="status r-status" aria-live="polite"></p>
  <pre class="r-summary" hidden></pre>
  <div class="actions"><button type="button" class="r-open" data-t="open_out"></button></div>
  <p class="status r-open-status" aria-live="polite"></p>
  <h3 class="r-report-head" data-t="h_report" hidden></h3>
  <pre class="r-report" hidden></pre>
  <details class="r-output-box" hidden>
    <summary data-t="h_output_tail"></summary>
    <pre class="r-output"></pre>
  </details>
</template>

<script>

const TOKEN = new URLSearchParams(location.search).get('t') || '';
const PAGE = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const $ = id => document.getElementById(id);

let L = S.en;
function t(key) {
  const args = Array.prototype.slice.call(arguments, 1);
  return (L[key] || key).replace(/\{(\d)\}/g, (m, i) => String(args[+i]));
}
function applyTexts(root) {
  (root || document).querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  (root || document).querySelectorAll('[data-t-label]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.tLabel)); });
  document.title = t('title');
}

let alive = true, status = null, pollTimer = null, jobRunning = false, jobKind = null;

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'X-Token': TOKEN}, opts.headers || {});
  return fetch(path, opts).then(r => r.json().then(j => {
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }));
}
function post(path, body) {
  return api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
}
function say(el, text, kind) {
  el = typeof el === 'string' ? $(el) : el;
  el.textContent = text || '';
  el.classList.remove('ok', 'warn', 'bad', 'info');   // other classes (hooks like r-status) stay
  el.classList.add('status');
  if (kind) el.classList.add(kind);
}
function cellText(tr, text, cls) {
  const td = document.createElement('td');
  td.textContent = text;
  if (cls) td.className = cls;
  tr.appendChild(td);
  return td;
}
function dirname(p) { const i = p.lastIndexOf('/'); return i > 0 ? p.slice(0, i) : '/'; }
function joinPath(dir, name) { return dir === '/' ? '/' + name : dir + '/' + name; }

function serviceGone(msg) {
  if (!alive) return;
  alive = false;
  $('closed').textContent = msg || t('closed');
  $('closed').hidden = false;
  document.querySelectorAll('button, input, select, textarea').forEach(el => { el.disabled = true; });
  if (pollTimer) clearInterval(pollTimer);
}

// ---------- heartbeat and closing
function ping() { post('/api/ping', {page: PAGE}).catch(() => serviceGone()); }
setInterval(() => { if (alive) ping(); }, 10000);
document.addEventListener('visibilitychange', () => { if (alive && !document.hidden) ping(); });
window.addEventListener('pageshow', ev => { if (alive && ev.persisted) ping(); });
// on close or reload; sendBeacon cannot set headers, so the token goes in the body
window.addEventListener('pagehide', () => {
  if (!alive || !navigator.sendBeacon) return;
  navigator.sendBeacon('/api/bye', new Blob([JSON.stringify({t: TOKEN, page: PAGE})], {type: 'text/plain'}));
});

// ---------- tabs: arrow keys, Home and End move between them
const tabs = Array.prototype.slice.call(document.querySelectorAll('[role=tab]'));
function selectTab(tab, focus) {
  tabs.forEach(x => {
    const on = x === tab;
    x.setAttribute('aria-selected', on ? 'true' : 'false');
    x.tabIndex = on ? 0 : -1;
    $(x.getAttribute('aria-controls')).hidden = !on;
  });
  if (focus !== false) tab.focus();
  if (tab.id === 'tab-tasks') loadTasks();
}
tabs.forEach((tab, i) => {
  tab.tabIndex = i === 0 ? 0 : -1;
  tab.addEventListener('click', () => selectTab(tab));
  tab.addEventListener('keydown', ev => {
    let j = null;
    if (ev.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (ev.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (ev.key === 'Home') j = 0;
    else if (ev.key === 'End') j = tabs.length - 1;
    if (j !== null) { ev.preventDefault(); selectTab(tabs[j]); }
  });
});

// mode 'dir' picks a folder, 'files' adds ticked documents, 'md' picks one md file
let openBrowser = null;
function closeBrowser() {
  if (!openBrowser) return;
  openBrowser.box.remove();
  openBrowser.button.setAttribute('aria-expanded', 'false');
  openBrowser.button.focus();
  openBrowser = null;
}
function showBrowser(button, home, opts) {
  if (openBrowser && openBrowser.button === button) { closeBrowser(); return; }
  closeBrowser();
  const box = $('browserTpl').content.firstElementChild.cloneNode(true);

  rs.forEach(r => {
    const tr = document.createElement('tr');
    cellText(tr, r.name, 'name');
    const o = taskOutcome(r), td = document.createElement('td'); td.className = 'wrap';
    const head = document.createElement('div'); head.className = o[1]; head.textContent = o[0]; td.appendChild(head);
    if (r.last_line && !r.dry_run) { const d = document.createElement('div'); d.textContent = r.last_line; td.appendChild(d); }
    const lg = document.createElement('div'); lg.className = 'hint mono'; lg.textContent = t('out_log', r.log); td.appendChild(lg);
    tr.appendChild(td); tb.appendChild(tr);
    const det = document.createElement('details'), sum = document.createElement('summary'), pre = document.createElement('pre');
    sum.textContent = r.name + ' — ' + t('h_output_tail'); pre.textContent = r.output || '';
    det.open = !!r.dry_run || o[1] === 'bad';
    det.appendChild(sum); det.appendChild(pre); outs.appendChild(det);
  });
  loadTasks();
}

// ---------- duplicate clean-up
let dryDone = null;   // the request whose dry run found something to remove
function dedupBody(dry) {
  return {target: $('dedupTarget').value.trim(), dry_run: dry, no_db: $('dedupNoDb').checked,
          base: $('dedupBase').value.split('\n').map(x => x.trim()).filter(Boolean)};
}
function sameRequest(a, b) { return a && b && a.target === b.target && a.base.join('\n') === b.base.join('\n'); }
['dedupTarget', 'dedupBase'].forEach(id => $(id).addEventListener('input', () => { dryDone = null; $('dedupClean').disabled = true; }));
$('dedupBrowse').addEventListener('click', () => showBrowser($('dedupBrowse'), 'browserHomeDedup', {
  mode: 'md', start: () => $('dedupTarget').value.trim() ? dirname($('dedupTarget').value.trim()) : '', onPick: pickInto($('dedupTarget'))}));
function runDedup(dry) {
  const body = dedupBody(dry);
  if (!dry) {
    if (!sameRequest(body, dryDone)) return;
    if (!confirm(t('dedup_confirm', dryDone.duplicate, dryDone.sections, body.target))) return;
  }
  say('dedupStatus', t('dedup_running'), 'info');
  $('dedupResult').hidden = true;
  setBusy(true, 'dedup');
  post('/api/dedup', body).then(startPolling).catch(e => {
    setBusy(false);
    say('dedupStatus', t('dedup_refused', e.message), 'bad');
  });
}
$('dedupDry').addEventListener('click', () => runDedup(true));
$('dedupClean').addEventListener('click', () => runDedup(false));
function renderDedup(job) {
  const r = job.result || {}, p = job.params;
  $('dedupResult').hidden = false;
  say('dedupStatus', '');
  if (job.state === 'cancelled') say('dedupResultStatus', t('dedup_cancelled'), 'warn');
  else if (job.rc !== 0) say('dedupResultStatus', t('dedup_failed', job.rc), 'bad');
  else if (p.dry_run) say('dedupResultStatus', r.duplicate ? t('dedup_dry_result', r.duplicate, r.sections, r.kept) : t('dedup_nothing'), r.duplicate ? 'info' : 'ok');
  else say('dedupResultStatus', r.backup ? t('dedup_done', r.duplicate, r.kept, r.backup) : t('dedup_done_none'), 'ok');
  dryDone = job.rc === 0 && p.dry_run && r.duplicate ? {target: p.target, base: p.base, duplicate: r.duplicate, sections: r.sections} : null;
  $('dedupClean').disabled = !dryDone;
  $('dedupReportHead').hidden = $('dedupReport').hidden = !r.report;
  $('dedupReport').textContent = r.report || '';
  $('dedupOutputBox').hidden = !job.output;
  $('dedupOutputBox').open = job.rc !== 0;
  $('dedupOutput').textContent = job.output || '';
}

// ---------- one task at a time: busy state, cancel and polling
const STARTERS = ['scan', 'run', 'filesRun', 'taskPreview', 'taskRun', 'taskRunAll', 'taskSave', 'dedupDry', 'dedupClean'];
const BATCH_INPUTS = ['src', 'srcBrowse', 'useSince', 'since', 'out', 'outBrowse', 'all', 'none', 'exSkip', 'exRedo', 'batchSize'];
const CANCEL = {scan: 'scanCancel', run: 'runCancel', files: 'filesCancel', tasks: 'tasksCancel', dedup: 'dedupCancel'};
const PROG = {scan: 'scanProg', run: 'runProg', files: 'filesProg', tasks: 'tasksProg', dedup: 'dedupProg'};
function setBusy(on, kind) {
  jobRunning = on; jobKind = on ? kind : null;
  STARTERS.forEach(id => { $(id).disabled = on || !alive; });
  BATCH_INPUTS.forEach(id => { $(id).disabled = (on && (kind === 'scan' || kind === 'run')) || !alive; });
  document.querySelectorAll('#fileRows input, .opts input').forEach(b => { b.disabled = on || !alive; });
  Object.keys(CANCEL).forEach(k => { $(CANCEL[k]).hidden = !(on && k === kind); });
  Object.keys(PROG).forEach(k => { $(PROG[k]).hidden = !(on && k === kind); });
  if (on) closeBrowser();
  else {
    $('run').disabled = !scan || rowsPending || !tickedRels().length;
    $('filesRun').disabled = !chosen.length;
    $('dedupClean').disabled = !dryDone;
    updateTaskNote();
  }
  syncOptions();
}
document.querySelectorAll('button.cancel').forEach(b => b.addEventListener('click', () => post('/api/cancel').catch(() => {})));

function startPolling() {
  if (!pollTimer) pollTimer = setInterval(poll, 700);
  poll();
}
function poll() {
  api('/api/job').then(job => {
    if (job.state === 'running') {
      if (!jobRunning) setBusy(true, job.kind);
      if (job.kind === 'run') renderProgress($('runProg'), $('runStatus'), job);
      else if (job.kind === 'files') renderProgress($('filesProg'), $('filesStatus'), job);
      else if (job.kind === 'tasks' && job.total) {
        $('tasksProg').value = Math.floor((job.cur - 1) * 100 / job.total);
        say('tasksStatus', t('tasks_running', job.cur, job.total, job.current), 'info');
      }
      return;
    }
    clearInterval(pollTimer); pollTimer = null;
    setBusy(false);
    if (job.kind === 'scan') renderScan(job);
    else if (job.kind === 'run') { say('runStatus', ''); renderConversion($('batchResult'), job); }
    else if (job.kind === 'files') { say('filesStatus', ''); renderConversion($('filesResult'), job); }
    else if (job.kind === 'tasks') renderTasksResult(job);
    else if (job.kind === 'dedup') renderDedup(job);
  }).catch(() => serviceGone());
}

// ---------- a reloaded page shows the current or latest task again: its tab, settings, progress, result
const TAB_OF = {scan: 'tab-batch', run: 'tab-batch', files: 'tab-files', tasks: 'tab-tasks', dedup: 'tab-dedup'};
function setOptions(prefix, p) {
  opt(prefix, 'o-merge').checked = !!p.merge; opt(prefix, 'o-inline').checked = !!p.inline;
  opt(prefix, 'o-images').checked = !!p.images; opt(prefix, 'o-dups').checked = !!p.keep_dups;
  syncOptions();
  opt(prefix, 'o-sheets').checked = !!p.sheets && !opt(prefix, 'o-sheets').disabled;
}
function restoreJob(job) {
  const p = job.params || {};
  if (TAB_OF[job.kind]) selectTab($(TAB_OF[job.kind]), false);
  if (job.kind === 'scan' || job.kind === 'run') {
    $('src').value = p.src || $('src').value;
    $('useSince').checked = !!p.since; $('sinceRow').hidden = !p.since;
    if (p.since) $('since').value = p.since;
  }
  if (job.kind === 'run') {
    $('out').value = p.out || ''; outEdited = true;
    setOptions('b', p);
    $('batchSize').value = p.batch_size === undefined ? 1000 : p.batch_size;
    $('exRedo').checked = !!p.force; $('exSkip').checked = !p.force;
    $('runCard').hidden = false;
    say('scanStatus', t('restored_rescan'), 'info');
  } else if (job.kind === 'files') {
    chosen = (p.files || []).slice();
    $('filesOut').value = p.out || ''; filesOutEdited = true;
    setOptions('f', p);
    renderChosen();
  } else if (job.kind === 'dedup') {
    $('dedupTarget').value = p.target || '';
    $('dedupBase').value = (p.base || []).join('\n');
    $('dedupNoDb').checked = !!p.no_db;
  }
  if (job.state === 'running') { setBusy(true, job.kind); startPolling(); }
  else poll();    // a finished task: its result
}

$('quit').addEventListener('click', () => {
  if (jobRunning && !confirm(t('quit_running'))) return;
  post('/api/quit').then(r => serviceGone(r.waiting ? t('closed_wait') : t('closed'))).catch(() => serviceGone());
});

// ---------- start
applyTexts();
api('/api/status').then(s => {
  status = s;
  L = S[s.lang] || S.en;
  document.documentElement.lang = s.lang === 'zh' ? 'zh-CN' : 'en';
  applyTexts();
  $('version').textContent = s.version ? t('version', s.version) : '';
  if (!$('src').value) $('src').value = s.home;
  syncOptions();
  renderChosen();
  ping();
  if (s.job && s.job.kind) restoreJob(s.job);
}).catch(e => say('error', t('load_failed', e.message), 'bad'));
</script>
</body>
</html>
