<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doc2kb</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; --focus:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --focus:#4493f8; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 "Noto Sans CJK SC","WenQuanYi Micro Hei","PingFang SC","Microsoft YaHei",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:17px; margin:0 0 10px; }
  .sub, .hint { color:var(--muted); }
  .sub { margin:4px 0 12px; }
  .hint { font-size:13px; margin:6px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:12px 0; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .row > input[type=text] { flex:1 1 220px; min-width:0; }
  label.field { display:block; color:var(--muted); margin:8px 0 4px; }
  input[type=text], input[type=date], select { padding:7px 10px; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); max-width:100%; }
  .check { display:flex; gap:8px; align-items:flex-start; margin:6px 0; }
  .check input { margin-top:5px; flex:none; }
  .check span small { display:block; color:var(--muted); font-size:13px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  button { padding:7px 14px; font:inherit; font-size:14px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  [role=tablist] { display:flex; flex-wrap:wrap; gap:4px; border-bottom:1px solid var(--line); margin:8px 0 0; }
  [role=tab] { border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; background:none; color:var(--muted); margin-bottom:-1px; }
  [role=tab][aria-selected=true] { background:var(--card); border-color:var(--line); color:var(--text); font-weight:bold; }
  .status { margin:8px 0 0; min-height:1.6em; white-space:pre-wrap; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); } .info { color:var(--accent); }
  pre, .mono { font:13px/1.5 "Noto Sans Mono CJK SC","DejaVu Sans Mono",monospace; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:8px 0 0; max-height:360px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
  .scroll { overflow-x:auto; max-height:420px; overflow-y:auto; border:1px solid var(--line); border-radius:6px; margin-top:8px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:normal; position:sticky; top:0; background:var(--card); }
  td.rel { word-break:break-all; min-width:12em; }
  td.num { text-align:right; white-space:nowrap; }
  .browser { border:1px solid var(--line); border-radius:6px; padding:8px; margin-top:8px; background:var(--bg); }
  .browser .here { word-break:break-all; margin:6px 0; }
  .browser ul { list-style:none; margin:6px 0; padding:0; max-height:260px; overflow:auto; }
  .browser li button { width:100%; text-align:left; border:none; background:none; padding:4px 6px; word-break:break-all; }
  .browser li button:hover { background:var(--card); }
  progress { width:100%; height:14px; margin-top:8px; }
  footer { color:var(--muted); font-size:13px; margin-top:24px; border-top:1px solid var(--line); padding-top:10px; }
  #closed { background:var(--card); border:1px solid var(--bad); color:var(--bad); border-radius:8px; padding:12px; margin-top:12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title"></h1>
    <button id="quit" type="button" data-t="quit"></button>
  </header>
  <p class="sub" data-t="sub"></p>
  <div id="closed" hidden></div>
  <p id="error" class="status bad" aria-live="polite"></p>

  <div role="tablist" id="tabs" data-t-label="tabs">
    <button role="tab" id="tab-batch" aria-controls="panel-batch" aria-selected="true" data-t="tab_batch"></button>
  </div>

  <section role="tabpanel" id="panel-batch" aria-labelledby="tab-batch" tabindex="0">
    <div class="card">
      <h2 data-t="h_source"></h2>
      <label class="field" for="src" data-t="src_label"></label>
      <div class="row">
        <input id="src" type="text" autocomplete="off" spellcheck="false">
        <button id="srcBrowse" type="button" aria-expanded="false" data-t="browse"></button>
      </div>
      <div id="browserHomeSrc"></div>
      <div class="check">
        <input id="useSince" type="checkbox">
        <label for="useSince"><span data-t="since_label"></span></label>
      </div>
      <div class="row" id="sinceRow" hidden>
        <input id="since" type="date" data-t-label="since_label">
        <span class="hint" data-t="since_hint"></span>
      </div>
      <div class="actions">
        <button id="scan" class="primary" type="button" data-t="scan"></button>
        <button id="scanCancel" type="button" data-t="cancel" hidden></button>
      </div>
      <progress id="scanProg" hidden></progress>
      <p id="scanStatus" class="status" aria-live="polite"></p>
    </div>

    <div class="card" id="listCard" hidden>
      <h2 data-t="h_files"></h2>
      <p id="listSummary"></p>
      <div class="actions">
        <button id="all" type="button" data-t="tick_all"></button>
        <button id="none" type="button" data-t="tick_none"></button>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th scope="col"><span data-t="col_take"></span></th><th scope="col" data-t="col_rel"></th><th scope="col" class="num" data-t="col_size"></th></tr></thead>
          <tbody id="fileRows"></tbody>
        </table>
      </div>
      <p id="listNote" class="status" aria-live="polite"></p>
      <details id="legacyBox" hidden>
        <summary id="legacySummary"></summary>
        <pre id="legacyList"></pre>
      </details>
    </div>

    <div class="card" id="runCard" hidden>
      <h2 data-t="h_output"></h2>
      <label class="field" for="out" data-t="out_label"></label>
      <div class="row">
        <input id="out" type="text" autocomplete="off" spellcheck="false">
        <button id="outBrowse" type="button" aria-expanded="false" data-t="browse"></button>
      </div>
      <div id="browserHomeOut"></div>
      <h2 style="margin-top:14px" data-t="h_options"></h2>
      <div class="check"><input id="optMerge" type="checkbox" checked><label for="optMerge"><span><span data-t="opt_merge"></span><small data-t="opt_merge_d"></small></span></label></div>
      <div class="check"><input id="optInline" type="checkbox" checked><label for="optInline"><span><span data-t="opt_inline"></span><small data-t="opt_inline_d"></small></span></label></div>
      <div class="check"><input id="optImages" type="checkbox"><label for="optImages"><span><span data-t="opt_images"></span><small data-t="opt_images_d"></small></span></label></div>
      <div class="check"><input id="optSheets" type="checkbox" disabled><label for="optSheets"><span><span data-t="opt_sheets"></span><small id="sheetsHint"></small></span></label></div>
      <div class="check"><input id="optKeepDups" type="checkbox"><label for="optKeepDups"><span><span data-t="opt_dups"></span><small data-t="opt_dups_d"></small></span></label></div>
      <fieldset id="existingBox" hidden style="border:1px solid var(--line); border-radius:6px; margin:8px 0 0">
        <legend data-t="existing_legend"></legend>
        <div class="check"><input id="exSkip" name="existing" type="radio" checked><label for="exSkip" data-t="existing_skip"></label></div>
        <div class="check"><input id="exRedo" name="existing" type="radio"><label for="exRedo" data-t="existing_redo"></label></div>
      </fieldset>
      <div class="actions">
        <button id="run" class="primary" type="button" data-t="run"></button>
        <button id="runCancel" type="button" data-t="cancel" hidden></button>
      </div>
      <progress id="runProg" max="100" value="0" hidden></progress>
      <p id="runStatus" class="status" aria-live="polite"></p>
    </div>

    <div class="card" id="resultCard" hidden>
      <h2 data-t="h_result"></h2>
      <p id="resultStatus" class="status" aria-live="polite"></p>
      <pre id="resultSummary" hidden></pre>
      <div class="actions">
        <button id="open" type="button" data-t="open_out"></button>
      </div>
      <p id="openStatus" class="status" aria-live="polite"></p>
      <h2 id="reportHead" style="margin-top:10px" data-t="h_report" hidden></h2>
      <pre id="reportText" hidden></pre>
      <details id="outputBox" hidden>
        <summary data-t="h_output_tail"></summary>
        <pre id="outputText"></pre>
      </details>
    </div>
  </section>

  <footer><span id="footRule" data-t="foot_rule"></span> <span id="version"></span></footer>
</main>

<template id="browserTpl">
  <div class="browser">
    <div class="row">
      <label class="hint b-rootlabel"></label>
      <select class="b-roots"></select>
      <button type="button" class="b-up"></button>
    </div>
    <div class="here mono"></div>
    <p class="hint b-count"></p>
    <ul class="b-dirs"></ul>
    <p class="status b-status" aria-live="polite"></p>
    <div class="actions">
      <button type="button" class="primary b-pick"></button>
      <button type="button" class="b-close"></button>
    </div>
  </div>
</template>

let L = S.en;
function t(key) {
  const args = Array.prototype.slice.call(arguments, 1);
  return (L[key] || key).replace(/\{(\d)\}/g, (m, i) => String(args[+i]));
}
function applyTexts() {
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('[data-t-label]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.tLabel)); });
  document.title = t('title');
}
applyTexts();

let alive = true, status = null, pollTimer = null, jobRunning = false, scan = null, outEdited = false;

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({'X-Token': TOKEN}, opts.headers || {});
  return fetch(path, opts).then(r => r.json().then(j => {
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }));
}
function post(path, body) {
  return api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
}
function say(el, text, kind) {
  el = typeof el === 'string' ? $(el) : el;
  el.textContent = text || '';
  el.className = 'status' + (kind ? ' ' + kind : '');
}

function serviceGone(msg) {
  if (!alive) return;
  alive = false;
  $('closed').textContent = msg || t('closed');
  $('closed').hidden = false;
  document.querySelectorAll('button, input, select').forEach(el => { el.disabled = true; });
  if (pollTimer) clearInterval(pollTimer);
}

// ---------- heartbeat and closing
function ping() { post('/api/ping', {page: PAGE}).catch(() => serviceGone()); }
setInterval(() => { if (alive) ping(); }, 10000);
document.addEventListener('visibilitychange', () => { if (alive && !document.hidden) ping(); });
window.addEventListener('pageshow', ev => { if (alive && ev.persisted) ping(); });
// on close or reload; sendBeacon cannot set headers, so the token goes in the body
window.addEventListener('pagehide', () => {
  if (!alive || !navigator.sendBeacon) return;
  navigator.sendBeacon('/api/bye', new Blob([JSON.stringify({t: TOKEN, page: PAGE})], {type: 'text/plain'}));
});

// ---------- tabs: arrow keys, Home and End move between them
const tabs = Array.prototype.slice.call(document.querySelectorAll('[role=tab]'));
function selectTab(tab) {
  tabs.forEach(x => {
    const on = x === tab;
    x.setAttribute('aria-selected', on ? 'true' : 'false');
    x.tabIndex = on ? 0 : -1;
    $(x.getAttribute('aria-controls')).hidden = !on;
  });
  tab.focus();
}
tabs.forEach((tab, i) => {
  tab.tabIndex = i === 0 ? 0 : -1;
  tab.addEventListener('click', () => selectTab(tab));
  tab.addEventListener('keydown', ev => {
    let j = null;
    if (ev.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (ev.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (ev.key === 'Home') j = 0;
    else if (ev.key === 'End') j = tabs.length - 1;
    if (j !== null) { ev.preventDefault(); selectTab(tabs[j]); }
  });
});

// ---------- folder browser (the service lists folders: a browser cannot hand out real paths)
let openBrowser = null;
function closeBrowser() {
  if (!openBrowser) return;
  openBrowser.box.remove();
  openBrowser.button.setAttribute('aria-expanded', 'false');
  openBrowser.button.focus();
  openBrowser = null;
}
function joinPath(dir, name) { return dir === '/' ? '/' + name : dir + '/' + name; }
function showBrowser(input, button, home) {
  if (openBrowser && openBrowser.input === input) { closeBrowser(); return; }
  closeBrowser();
  const box = $('browserTpl').content.firstElementChild.cloneNode(true);
  $(home).appendChild(box);
  button.setAttribute('aria-expanded', 'true');
  const q = c => box.querySelector(c);
  q('.b-rootlabel').textContent = t('b_roots');
  q('.b-up').textContent = t('b_up');
  q('.b-pick').textContent = t('b_pick');
  q('.b-close').textContent = t('b_close');
  const roots = q('.b-roots');
  roots.setAttribute('aria-label', t('b_roots'));
  (status ? status.roots : ['/']).forEach(r => {
    const o = document.createElement('option'); o.value = r; o.textContent = r; roots.appendChild(o);
  });
  const st = {box: box, input: input, button: button, path: null, parent: null};
  openBrowser = st;
  function load(path) {
    return api('/api/ls?path=' + encodeURIComponent(path)).then(d => {
      st.path = d.path; st.parent = d.parent;
      q('.here').textContent = d.path;
      q('.b-up').disabled = !d.parent;
      const docs = d.files.filter(f => f.kind !== 'legacy').length;
      q('.b-count').textContent = t('b_count', docs);
      const ul = q('.b-dirs'); ul.textContent = '';
      if (!d.dirs.length) {
        const li = document.createElement('li'); li.className = 'hint'; li.textContent = t('b_empty'); ul.appendChild(li);
      }
      d.dirs.forEach(name => {
        const li = document.createElement('li'), b = document.createElement('button');
        b.type = 'button'; b.textContent = '📁 ' + name;
        b.addEventListener('click', () => load(joinPath(d.path, name)).then(() => { const f = q('.b-dirs button'); if (f) f.focus(); }));
        li.appendChild(b); ul.appendChild(li);
      });
      say(q('.b-status'), '');
    }).catch(e => say(q('.b-status'), t('b_failed', e.message), 'bad'));
  }
  roots.addEventListener('change', () => load(roots.value));
  q('.b-up').addEventListener('click', () => { if (st.parent) load(st.parent); });
  q('.b-pick').addEventListener('click', () => {
    if (!st.path) return;
    input.value = st.path;
    input.dispatchEvent(new Event('input'));
    closeBrowser();
  });
  q('.b-close').addEventListener('click', closeBrowser);
  box.addEventListener('keydown', ev => { if (ev.key === 'Escape') { ev.preventDefault(); closeBrowser(); } });
  load(input.value.trim() || (status && status.home) || '/').then(() => roots.focus(), () => roots.focus());
}
$('srcBrowse').addEventListener('click', () => showBrowser($('src'), $('srcBrowse'), 'browserHomeSrc'));
$('outBrowse').addEventListener('click', () => showBrowser($('out'), $('outBrowse'), 'browserHomeOut'));

// ---------- step 1: source and scan
function threeMonthsAgo() {
  const d = new Date(); d.setMonth(d.getMonth() - 3);
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
$('since').value = threeMonthsAgo();
$('useSince').addEventListener('change', () => { $('sinceRow').hidden = !$('useSince').checked; });
$('src').addEventListener('input', () => {
  scan = null;
  $('listCard').hidden = true; $('runCard').hidden = true; $('resultCard').hidden = true;
  say('scanStatus', '');
});
$('out').addEventListener('input', () => { outEdited = true; });

$('scan').addEventListener('click', () => {
  const body = {src: $('src').value, since: $('useSince').checked ? $('since').value : ''};
  say('scanStatus', t('scanning'), 'info');
  setBusy(true, 'scan');
  post('/api/scan', body).then(startPolling).catch(e => {
    setBusy(false);
    say('scanStatus', t('scan_failed', e.message), 'bad');
  });
});
$('scanCancel').addEventListener('click', () => post('/api/cancel').catch(() => {}));

function renderScan(job) {
  const r = job.result || {};
  if (job.state === 'cancelled') { say('scanStatus', t('scan_cancelled'), 'warn'); return; }
  if (job.rc !== 0 || !r.files) {
    const last = (job.output || '').trim().split('\n').pop() || ('exit ' + job.rc);
    say('scanStatus', t('scan_failed', last), 'bad');
    return;
  }
  scan = {src: job.params.src, since: job.params.since, files: r.files};
  if (!r.files.length) {
    say('scanStatus', r.filtered ? t('scan_none_filtered', r.filtered) : t('scan_none'), 'warn');
  } else {
    say('scanStatus', t('scan_done', r.files.length), 'ok');
  }
  const tb = $('fileRows'); tb.textContent = '';
  r.files.forEach((f, i) => {
    const tr = document.createElement('tr');
    const c0 = document.createElement('td'), box = document.createElement('input');
    box.type = 'checkbox'; box.checked = true; box.id = 'f' + i; box.dataset.rel = f.rel;
    box.setAttribute('aria-label', f.rel);
    box.addEventListener('change', updateTicked);
    c0.appendChild(box);
    const c1 = document.createElement('td'); c1.className = 'rel';
    const lab = document.createElement('label'); lab.htmlFor = box.id; lab.textContent = f.rel; c1.appendChild(lab);
    const c2 = document.createElement('td'); c2.className = 'num'; c2.textContent = f.size;
    tr.appendChild(c0); tr.appendChild(c1); tr.appendChild(c2); tb.appendChild(tr);
  });
  $('listSummary').textContent = t('list_summary', r.files.length) + (r.filtered ? t('list_filtered', r.filtered) : '');
  $('legacyBox').hidden = !r.legacy.length;
  if (r.legacy.length) {
    $('legacySummary').textContent = t('legacy_summary', r.legacy.length);
    $('legacyList').textContent = r.legacy.join('\n') + '\n\n' + t('legacy_hint');
  }
  $('listCard').hidden = !r.files.length;
  $('runCard').hidden = !r.files.length;
  if (!outEdited || !$('out').value.trim()) { $('out').value = r.out_default; outEdited = false; }
  updateTicked();
}

function tickedRels() {
  return Array.prototype.slice.call(document.querySelectorAll('#fileRows input:checked')).map(b => b.dataset.rel);
}
function updateTicked() {
  const rels = tickedRels(), total = scan ? scan.files.length : 0;
  const pdfs = rels.filter(r => /\.pdf$/i.test(r)).length;
  let text = t('ticked', rels.length, total), kind = 'info';
  if (pdfs) {
    text += '\n' + (status && !status.tools.pdftotext ? t('pdf_missing', pdfs) : t('pdf_lossy'));
    kind = 'warn';
  }
  say('listNote', text, kind);
  if (!jobRunning) $('run').disabled = !rels.length;
}
$('all').addEventListener('click', () => { document.querySelectorAll('#fileRows input').forEach(b => { b.checked = true; }); updateTicked(); });
$('none').addEventListener('click', () => { document.querySelectorAll('#fileRows input').forEach(b => { b.checked = false; }); updateTicked(); });

// ---------- step 3: options and run
function syncOptions() {
  const montage = status && status.tools.montage;
  const sheets = $('optSheets');
  sheets.disabled = !montage || !$('optImages').checked || jobRunning;
  if (sheets.disabled) sheets.checked = false;
  $('sheetsHint').textContent = !montage ? t('sheets_no_tool') : ($('optImages').checked ? t('opt_sheets_d') : t('sheets_need_images'));
  $('existingBox').hidden = $('optMerge').checked;
}
['optMerge', 'optImages'].forEach(id => $(id).addEventListener('change', syncOptions));

function runBody() {
  return {
    src: scan.src, since: scan.since, out: $('out').value, only: tickedRels(),
    merge: $('optMerge').checked, inline: $('optInline').checked, images: $('optImages').checked,
    sheets: $('optSheets').checked, keep_dups: $('optKeepDups').checked,
    force: !$('optMerge').checked && $('exRedo').checked
  };
}
$('run').addEventListener('click', () => {
  if (!scan) return;
  const body = runBody();
  $('run').disabled = true;
  post('/api/check', body).then(c => {
    let ok = true;
    if (c.replace.length) ok = confirm(t('confirm_replace', c.out, c.replace.join('\n')));
    else if (body.force && c.existing_md) ok = confirm(t('confirm_redo', c.existing_md, c.out));
    if (!ok) { $('run').disabled = false; return; }
    say('runStatus', t('starting'), 'info');
    $('resultCard').hidden = true;
    setBusy(true, 'run');
    return post('/api/run', body).then(startPolling);
  }).catch(e => {
    setBusy(false);
    $('run').disabled = false;
    say('runStatus', t('run_refused', e.message), 'bad');
  });
});
$('runCancel').addEventListener('click', () => post('/api/cancel').catch(() => {}));

function setBusy(on, kind) {
  jobRunning = on;
  ['scan', 'src', 'srcBrowse', 'useSince', 'since', 'out', 'outBrowse', 'all', 'none',
   'optMerge', 'optInline', 'optImages', 'optKeepDups', 'exSkip', 'exRedo'].forEach(id => { $(id).disabled = on || !alive; });
  document.querySelectorAll('#fileRows input').forEach(b => { b.disabled = on; });
  $('scanCancel').hidden = !(on && kind === 'scan');
  $('runCancel').hidden = !(on && kind === 'run');
  $('scanProg').hidden = !(on && kind === 'scan');
  $('runProg').hidden = !(on && kind === 'run');
  if (on) { $('run').disabled = true; closeBrowser(); }
  else if (scan) $('run').disabled = !tickedRels().length;
  syncOptions();
}

function renderProgress(job) {
  if (job.kind === 'scan') return;
  const p = $('runProg');
  if (!job.total) { say('runStatus', t('preparing'), 'info'); p.removeAttribute('value'); return; }
  p.value = Math.floor((job.cur - 1) * 100 / job.total);
  say('runStatus', job.cur >= job.total ? t('progress_last', job.current) : t('progress', job.cur, job.total, job.current), 'info');
}

function renderRun(job) {
  const r = job.result || {}, p = job.params, st = r.stats || {};
  $('resultCard').hidden = false;
  say('runStatus', '');
  const lines = [];
  let kind = 'ok';
  if (job.state === 'cancelled') {
    kind = 'warn';
    if (p.merge) lines.push(t('cancel_merged') + (r.report ? t('cancel_merged_report') : ''));
    else lines.push(t('cancel_single', r.written_md || 0) + (r.report ? t('cancel_single_report') : ''));
  } else if (job.rc === 0) {
    const failed = (r.failed || []).length;
    if (failed) { kind = 'warn'; lines.push(t('done_failed', failed)); }
    else lines.push(t('done_ok', st.new || 0));
  } else if (job.rc === 10) {
    kind = 'warn'; lines.push(t('done_nomatch'));
  } else {
    kind = 'bad'; lines.push(t('done_error', job.rc));
  }
  if ((r.skipped_pdf || []).length) { lines.push(t('pdf_skipped', r.skipped_pdf.length)); if (kind === 'ok') kind = 'warn'; }
  say('resultStatus', lines.join('\n'), kind);
  $('resultSummary').hidden = !(r.summary && r.summary.length);
  $('resultSummary').textContent = (r.summary || []).join('\n');
  $('reportHead').hidden = $('reportText').hidden = !r.report;
  $('reportText').textContent = r.report || '';
  $('outputBox').hidden = !job.output;
  $('outputBox').open = kind === 'bad';
  $('outputText').textContent = job.output || '';
  $('open').hidden = !(status && status.tools['xdg-open']);
  say('openStatus', '');
  $('resultStatus').scrollIntoView({block: 'nearest'});
}
$('open').addEventListener('click', () => {
  post('/api/open').then(() => say('openStatus', '')).catch(e => say('openStatus', t('open_failed', e.message), 'bad'));
});

// ---------- polling the task
function startPolling() {
  if (!pollTimer) pollTimer = setInterval(poll, 700);
  poll();
}
function poll() {
  api('/api/job').then(job => {
    if (job.state === 'running') {
      if (!jobRunning) setBusy(true, job.kind);
      renderProgress(job);
      return;
    }
    clearInterval(pollTimer); pollTimer = null;
    setBusy(false);
    if (job.kind === 'scan') renderScan(job);
    else if (job.kind === 'run') renderRun(job);
  }).catch(() => serviceGone());
}

$('quit').addEventListener('click', () => {
  if (jobRunning && !confirm(t('quit_running'))) return;
  post('/api/quit').then(r => serviceGone(r.waiting ? t('closed_wait') : t('closed'))).catch(() => serviceGone());
});

// ---------- start
api('/api/status').then(s => {
  status = s;
  L = S[s.lang] || S.en;
  document.documentElement.lang = s.lang === 'zh' ? 'zh-CN' : 'en';
  applyTexts();
  $('version').textContent = s.version ? t('version', s.version) : '';
  if (!$('src').value) $('src').value = s.home;
  syncOptions();
  ping();
  if (s.job && s.job.state === 'running') { setBusy(true, s.job.kind); startPolling(); }
}).catch(e => say('error', t('load_failed', e.message), 'bad'));
</script>
</body>
